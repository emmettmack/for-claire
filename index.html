<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A letter for Claire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="env-wrap" id="envWrap">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Open the letter">
      <div class="back"></div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="seal"><svg viewBox="0 0 24 22"><path d="M12 21 C-3 11 3 0 12 6 C21 0 27 11 12 21Z" fill="#ff5c9e" stroke="#fff" stroke-width="1.2"/></svg></div>
      <div class="for">For Claire</div>
    </div>
    <div class="hint">tap to open</div>
  </div>

  <section class="letter" id="letter" aria-live="polite">
    <p class="dear">Dear Claire,</p>
    <p>I have something super important to ask you…</p>
    <div class="big">Will you be my girlfriend?</div>
    <div class="btns">
      <button class="btn yes" id="yes">Yes!</button>
      <button class="btn no" id="no">No</button>
    </div>
    <div class="sign">(please?)</div>
  </section>
</main>
<script src="audio.js"></script>
<script src="common.js"></script>
<script src="home.js"></script>
</body>
</html>
