<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A letter for Claire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="letter show" id="letter">
    <div class="big">Will you be my girlfriend?</div>
    <div class="again again-letter">try again</div>
    <div class="btns">
      <button class="btn yes" id="yes">Yes!</button>
      <button class="btn no" id="no">No</button>
    </div>
    <div class="sign">(please?)</div>
  </section>
</main>
<div class="vol-hint" id="volHint">
  <svg viewBox="0 0 32 24" width="30" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 9v6h4l6 5V4L6 9H2z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5a9.5 9.5 0 0 1 0 14"/>
    <path d="M28 18V6M24.5 9.5L28 6l3.5 3.5"/>
  </svg>
  <span>turn your volume up</span>
</div>
<script src="audio.js"></script>
<script src="common.js"></script>
<script src="yesscene.js"></script>
<script src="ask.js"></script>
</body>
</html>
